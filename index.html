<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensei QR - Premium QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 42px;
            margin-bottom: 5px;
        }
        p {
            color: #e2e8f0;
            margin-bottom: 30px;
            font-size: 18px;
        }
        input {
            width: 90%;
            max-width: 400px;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }
        button {
            background-color: #38bdf8;
            color: black;
            font-weight: bold;
            font-size: 18px;
            border: none;
            border-radius: 16px;
            padding: 16px 30px;
            cursor: pointer;
            width: 90%;
            max-width: 400px;
        }
        #qrcode {
            margin-top: 30px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        #qrcode img {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Sensei QR</h1>
    <p>Premium QR Code Generator</p>
    
    <input type="text" id="text" value="https://youtube.com/@YoramShah" placeholder="Enter link here">
    
    <button onclick="generateQR()">Generate QR Code</button>
    
    <div id="qrcode"></div>

    <script>
        function generateQR() {
            var qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = "";
            qrcodeDiv.style.display = "block";
            
            var text = document.getElementById("text").value;
            if(text.trim() === "") {
                alert("Please enter a link!");
                qrcodeDiv.style.display = "none";
                return;
            }

            new QRCode(qrcodeDiv, {
                text: text,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }
    </script>
</body>
</html>
