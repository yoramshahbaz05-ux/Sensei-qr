<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensei QR - Premium QR Generator</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{background:#0f172a;color:white;text-align:center;padding:20px;font-family:sans-serif;margin:0}
h2{color:#38bdf8;font-size:32px;margin-top:40px;letter-spacing:1px}
input{width:90%;max-width:400px;padding:16px;border-radius:14px;border:none;outline:none;font-size:16px}
.btn{width:90%;max-width:400px;padding:15px;border:none;border-radius:14px;font-weight:bold;font-size:16px;cursor:pointer}
.gen{background:#38bdf8;color:#000}
.down{background:#22c55e;color:white;display:none;margin:10px auto}
#qr{background:white;padding:18px;border-radius:20px;margin:25px auto;width:210px;min-height:210px;box-shadow:0 10px 30px rgba(56,189,248,0.3)}
</style>
</head>
<body>
<h2>Sensei QR</h2>
<p style="color:#94a3b8">Premium QR Code Generator</p>
<input id="txt" placeholder="Enter link or text here">
<br><br>
<button class="btn gen" onclick="make()">Generate QR Code</button>
<div id="qr"></div>
<button id="dl" class="btn down" onclick="downloadQR()">📥 Download QR Code</button>
<script>
function make(){
var v=document.getElementById('txt').value.trim();
if(!v){alert('Please enter link or text');return;}
document.getElementById('qr').innerHTML='';
new QRCode(document.getElementById('qr'),{text:v,width:200,height:200,colorDark:"#0f172a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});
document.getElementById('dl').style.display='block';
}
function downloadQR(){
var img=document.querySelector('#qr img');
if(!img){alert('Generate QR first');return;}
var a=document.createElement('a');
a.href=img.src;
a.download='Sensei-QR-Premium.png';
a.click();
}
</script>
</body>
</html>
